[package]
name = "koinon-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "P2P gossip networking for TPT Oikos settlement layer"

[dependencies]
koinon-ledger = { workspace = true }
koinon-dag = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
thiserror = "2"
rand = "0.9"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
